<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f2e7">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="tea.css">
<title>16茶 — 十六夜の茶会</title>
</head>
<body>
<main class="app" id="app">
 <header><div class="brand"><span class="brand-mark" aria-hidden="true">茶</span><div><h1>16茶</h1><small>十六夜の茶会</small></div></div><div class="header-actions"><button id="mapButton" aria-label="茶会の地図">八席の旅</button><button id="helpButton" class="round" aria-label="遊び方">?</button></div></header>
 <section class="chapter" aria-label="現在の席"><div><span id="caseNumber" class="eyebrow"></span><h2 id="caseTitle"></h2></div><div id="progress" class="progress" aria-label="茶会の進み具合"></div></section>
 <section class="rule-card" aria-label="この席のルール"><span class="rule-icon" id="ruleIcon" aria-hidden="true">葉</span><div><strong id="ruleTitle"></strong><p id="ruleDetail"></p></div></section>
 <section class="stage" aria-label="お茶の量と手数"><div class="stat"><span>16まで、あと</span><strong id="remaining">3</strong><small id="currentLabel">いま 13 / 16</small></div><div class="vessel-wrap" aria-hidden="true"><div class="steam"><i></i><i></i><i></i></div><div class="vessel" id="vessel"><div id="layers" class="layers"></div><div class="target"><span>16</span></div><div class="vessel-seal">十六</div><div id="pourNumber" class="pour-number"></div></div><div class="saucer"></div></div><div class="stat"><span>残り手数</span><strong id="turns">2</strong><small id="pourCounter"></small></div></section>
 <section class="clue-card" aria-labelledby="clueTitle"><div class="clue-top"><h3 id="clueTitle">茶師の手がかり</h3><span>元の量：1・2・3・4 が1色ずつ</span></div><div id="clues" class="clues"></div><div id="mission" class="mission" hidden></div></section>
 <div id="message" class="message" role="status" aria-live="polite"></div>
 <section class="controls" aria-label="お茶の操作"><div class="control-heading"><strong id="actionLabel">お茶を選んで注ぐ</strong><span id="nextEffect"></span></div><div id="teaButtons" class="tea-buttons"></div><div class="utilities"><button id="inspectButton"></button><button id="toolButton" hidden></button><button id="notesButton">注いだ記録</button></div></section>
 <p class="footer" id="footer">16を超えた瞬間に失敗。時間制限はありません。</p>
</main>
<div class="overlay" id="overlay" hidden><section id="dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" tabindex="-1"></section></div>
<script src="game-core.js"></script><script src="game.js"></script>
</body>
</html>
