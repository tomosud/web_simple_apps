<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Nexus WebGPU Coin Benchmark</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #081014; }
    canvas { width: 100% !important; height: 100% !important; display: block; }
    #status { position: fixed; inset: 0; display: grid; place-content: center; gap: 14px; padding: 24px;
      color: #d7e4e8; background: radial-gradient(circle at 50% 42%, #18333b, #081014 62%);
      font: 500 15px/1.55 system-ui, sans-serif; text-align: center; z-index: 10; }
    #status.error { color: #ffb4ab; }
    .spinner { width: 36px; height: 36px; margin: auto; border: 3px solid #31505a;
      border-top-color: #55d6e2; border-radius: 50%; animation: spin .8s linear infinite; }
    #telemetry { position: fixed; right: 12px; bottom: 12px; z-index: 5; padding: 8px 11px; border: 1px solid #31505a;
      border-radius: 7px; background: #081014cc; color: #bcecf0; font: 600 13px/1.35 ui-monospace, monospace; pointer-events: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="status"><div>Nexus WebGPUを読み込み中…<br>初回はGPUシェーダーの準備に時間がかかります。</div><div class="spinner"></div></div>
  <div id="telemetry">Web FPS --</div>
  <script type="module">
    const CACHE_VERSION = '20260927062118';
    const status = document.getElementById('status');
    const telemetry = document.getElementById('telemetry');
    const frameSamples = [];
    let previousFrame = performance.now();
    const sampleFrame = (now) => {
      const dt = now - previousFrame;
      previousFrame = now;
      if (dt > 0 && dt < 1000) {
        frameSamples.push(dt);
        if (frameSamples.length > 120) frameSamples.shift();
        const averageMs = frameSamples.reduce((sum, value) => sum + value, 0) / frameSamples.length;
        const fps = 1000 / averageMs;
        window.webFrameStats = { fps, frameMs: averageMs, samples: frameSamples.length };
        telemetry.textContent = `Web FPS ${fps.toFixed(1)} | ${averageMs.toFixed(2)} ms`;
      }
      requestAnimationFrame(sampleFrame);
    };
    requestAnimationFrame(sampleFrame);
    const fail = (message) => { status.className = 'error'; status.innerHTML = message; };
    const isChromium = /Chrome|Chromium|Edg\//.test(navigator.userAgent);
    if (!isChromium) {
      fail('このベンチマークはPC版Chrome / Edge専用です。');
    } else if (!navigator.gpu) {
      fail('WebGPUを利用できません。Chrome / Edgeを更新し、GPUアクセラレーションを有効にしてください。');
    } else {
      import(`./pkg/nexus_coin_benchmark.js?v=${CACHE_VERSION}`)
        .then(({ default: init }) => init())
        .then(() => { status.style.display = 'none'; })
        .catch((error) => {
          console.error(error);
          fail(`起動に失敗しました。<br><small>${String(error.message || error)}</small>`);
        });
    }
  </script>
</body>
</html>
